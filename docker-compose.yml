services:
  poetry-api:
    image: ghcr.io/ericismyeldestson/chinese-poetry-api:${IMAGE_VERSION:-1.1.2}
    build:
      context: .
    container_name: poetry-api
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-1279}:${PORT:-1279}"
    environment:
      TZ: Asia/Shanghai
      PORT: ${PORT:-1279}
      DATA_DIR: ${DATA_DIR:-data}
      DB_FILE: ${DB_FILE:-poetry.db}
      DATA_RELEASE_VERSION: ${DATA_RELEASE_VERSION:-v1.1.0}
      DATA_RELEASE_BASE_URL: ${DATA_RELEASE_BASE_URL:-}
      DATA_ARCHIVE_URL: ${DATA_ARCHIVE_URL:-}
      DATA_CHECKSUM_URL: ${DATA_CHECKSUM_URL:-}
      # Optional: Override database connection pool (default: auto-detect based on CPU cores)
      # - DB_MAX_OPEN_CONNS=20
      # - DB_MAX_IDLE_CONNS=10
    volumes:
      - poetry-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 2 http://127.0.0.1:$${PORT}/api/v1/health || exit 1"]

volumes:
  poetry-data:
