name: Audit upload-artifact v7 round trip

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upload:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Download and verify the immutable v1.1.0 data bundle
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RELEASE_TAG: v1.1.0
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/source-assets"
          release_json="${RUNNER_TEMP}/release.json"
          mkdir -p "$source_dir"

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${AUDIT_RELEASE_TAG}" \
            >"$release_json"
          jq -e --arg tag "$AUDIT_RELEASE_TAG" '
            .immutable == true and
            .tag_name == $tag and
            .target_commitish == "989aaf6862a3f9a02289096239dc3bf51d50c66d" and
            (.assets | length) == 9 and
            (.assets | all(
              .state == "uploaded" and
              (.digest | startswith("sha256:"))
            )) and
            ([.assets[].name] | sort) == [
              "NOTICE",
              "checksums.txt",
              "chinese-poetry-MIT.txt",
              "data-source-manifest.json",
              "hanconv-MIT.txt",
              "opencc-dictionaries-Apache-2.0.txt",
              "opencc-dictionaries.SHA256",
              "poetry.db.gz",
              "poetry.db.source-report.json"
            ]
          ' "$release_json" >/dev/null

          gh release download "$AUDIT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$source_dir"

          actual_total=0
          while IFS=$'\t' read -r name expected_digest expected_size; do
            asset_path="${source_dir}/${name}"
            test -f "$asset_path"
            actual_digest="sha256:$(sha256sum "$asset_path" | awk '{ print $1 }')"
            actual_size=$(stat -c %s "$asset_path")
            [[ $actual_digest == "$expected_digest" ]]
            [[ $actual_size == "$expected_size" ]]
            ((actual_total += actual_size))
          done < <(
            jq -r '.assets[] | [.name, .digest, (.size | tostring)] | @tsv' \
              "$release_json"
          )
          expected_total=$(jq '[.assets[].size] | add' "$release_json")
          [[ $actual_total == "$expected_total" ]]
          ((actual_total > 1024 * 1024 * 1024))
          (
            cd "$source_dir"
            awk '$2 != "poetry.db" { print }' checksums.txt | sha256sum -c -
          )

      - name: Upload the release-equivalent bundle with v7.0.1
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-poetry-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  download-and-verify:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Download with the production v4 consumer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audit-poetry-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/downloaded-assets

      - name: Verify the downloaded bundle byte for byte
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RELEASE_TAG: v1.1.0
          ARTIFACT_ID: ${{ needs.upload.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.upload.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          download_dir="${RUNNER_TEMP}/downloaded-assets"
          release_json="${RUNNER_TEMP}/release.json"

          [[ $ARTIFACT_ID =~ ^[0-9]+$ ]]
          [[ $ARTIFACT_DIGEST =~ ^[0-9a-f]{64}$ ]]
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${AUDIT_RELEASE_TAG}" \
            >"$release_json"
          jq -e '.immutable == true and (.assets | length) == 9' \
            "$release_json" >/dev/null

          actual_total=0
          while IFS=$'\t' read -r name expected_digest expected_size; do
            asset_path="${download_dir}/${name}"
            test -f "$asset_path"
            actual_digest="sha256:$(sha256sum "$asset_path" | awk '{ print $1 }')"
            actual_size=$(stat -c %s "$asset_path")
            [[ $actual_digest == "$expected_digest" ]]
            [[ $actual_size == "$expected_size" ]]
            ((actual_total += actual_size))
          done < <(
            jq -r '.assets[] | [.name, .digest, (.size | tostring)] | @tsv' \
              "$release_json"
          )
          expected_total=$(jq '[.assets[].size] | add' "$release_json")
          [[ $actual_total == "$expected_total" ]]
          [[ $(find "$download_dir" -maxdepth 1 -type f | wc -l) -eq 9 ]]
          (
            cd "$download_dir"
            awk '$2 != "poetry.db" { print }' checksums.txt | sha256sum -c -
          )

          {
            echo "### upload-artifact v7.0.1 round trip"
            echo
            echo "- Immutable source Release: \`${AUDIT_RELEASE_TAG}\`"
            echo "- Files verified: 9"
            echo "- Payload bytes verified: \`${actual_total}\`"
            echo "- Artifact ID: \`${ARTIFACT_ID}\`"
            echo "- Artifact digest: \`sha256:${ARTIFACT_DIGEST}\`"
            echo "- Consumer: pinned \`actions/download-artifact@v4\`"
          } >>"$GITHUB_STEP_SUMMARY"
