name: Release Image

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_tag:
        description: Stable vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string
      release_sha:
        description: Exact source commit to build
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    if: inputs.release_tag != '' || !endsWith(github.ref_name, '.0')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.12
          cache: true
      - name: Run release tests with race detection
        run: go test -race -tags sqlite_fts5 ./...
      - name: Run static analysis
        run: go vet -tags sqlite_fts5 ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify data and startup contracts
        run: |
          sh scripts/verify-data-contract.sh --contract-only
          sh scripts/test-startup.sh
          sh scripts/verify-license-contract.sh
      - name: Verify the exact published data release and every required asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Image releases require a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          VERSION=${RELEASE_TAG#v}
          DATA_TAG=v${VERSION%.*}.0
          grep -Fq "DATA_RELEASE_VERSION=${DATA_TAG}" Dockerfile
          grep -Fq "DATA_RELEASE_VERSION: \${DATA_RELEASE_VERSION:-${DATA_TAG}}" docker-compose.yml

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${DATA_TAG}" > data-release.json
          jq -e --arg tag "$DATA_TAG" '
            .tag_name == $tag and .draft == false and .prerelease == false
          ' data-release.json >/dev/null
          expected='NOTICE checksums.txt chinese-poetry-MIT.txt data-source-manifest.json hanconv-MIT.txt opencc-dictionaries-Apache-2.0.txt opencc-dictionaries.SHA256 poetry.db.gz poetry.db.source-report.json'
          actual=$(jq -r '.assets[] | select(.size > 0) | .name' data-release.json | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          [ "$actual" = "$expected" ] || {
            echo "Data release assets are missing, empty, or unexpected: $actual" >&2
            exit 1
          }

          mkdir data-release
          for asset in $expected; do
            gh release download "$DATA_TAG" --dir data-release --pattern "$asset"
          done
          (
            cd data-release
            awk '$2 != "poetry.db" { print }' checksums.txt | sha256sum -c -
            gzip -dc poetry.db.gz > poetry.db
            sha256sum -c <(awk '$2 == "poetry.db" { print }' checksums.txt)
          )
          EXPECTED_RELEASE_TAG="$DATA_TAG" sh scripts/verify-data-contract.sh \
            --database data-release/poetry.db \
            --source-report data-release/poetry.db.source-report.json \
            --manifest data-release/data-source-manifest.json

          DATA_COMMIT=$(jq -er '.pipeline.commit' data-release/data-source-manifest.json)
          DATA_TAG_COMMIT=$(git rev-list -n 1 "$DATA_TAG")
          [ "$DATA_COMMIT" = "$DATA_TAG_COMMIT" ] || {
            echo "Data release manifest does not identify the data tag commit" >&2
            exit 1
          }
          git merge-base --is-ancestor "$DATA_COMMIT" "$RELEASE_SHA" || {
            echo "Image source is not descended from its data-release source" >&2
            exit 1
          }

  publish:
    if: inputs.release_tag != '' || !endsWith(github.ref_name, '.0')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Refuse to overwrite any published image tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          VERSION=${RELEASE_TAG#v}
          for tag in "$RELEASE_TAG" "$VERSION" "sha-${RELEASE_SHA}"; do
            if docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${tag}" >/dev/null 2>inspect-error; then
              echo "Image tag already exists and will not be overwritten: ${tag}" >&2
              exit 1
            fi
            grep -Eqi 'not found|manifest unknown|no such manifest' inspect-error || {
              echo "Could not prove image tag ${tag} is unused:" >&2
              cat inspect-error >&2
              exit 1
            }
          done
      - name: Extract immutable version metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.release_tag || github.ref_name }}
            type=semver,value=${{ inputs.release_tag || github.ref_name }},pattern={{version}}
            type=raw,value=sha-${{ inputs.release_sha || github.sha }}
      - name: Build and push signed-source image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VCS_REF=${{ inputs.release_sha || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
