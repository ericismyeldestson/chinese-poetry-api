name: Release Image

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      release_tag:
        description: Stable vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string
      release_sha:
        description: Exact source commit to build
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-image-publication
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.release_tag != '' || !endsWith(github.ref_name, '.0')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.13
          cache: true
      - name: Run release tests with race detection
        run: go test -race -tags sqlite_fts5 ./...
      - name: Run static analysis
        run: go vet -tags sqlite_fts5 ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Verify data and startup contracts
        run: |
          sh scripts/verify-data-contract.sh --contract-only
          sh scripts/test-startup.sh
          sh scripts/verify-license-contract.sh
      - name: Verify the exact published data release and every required asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Image releases require a stable vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          VERSION=${RELEASE_TAG#v}
          DATA_TAG=v${VERSION%.*}.0
          grep -Fq "DATA_RELEASE_VERSION=${DATA_TAG}" Dockerfile
          grep -Fq "DATA_RELEASE_VERSION: \${DATA_RELEASE_VERSION:-${DATA_TAG}}" docker-compose.yml

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${DATA_TAG}" > data-release.json
          jq -e --arg tag "$DATA_TAG" '
            .tag_name == $tag and .draft == false and .prerelease == false
          ' data-release.json >/dev/null
          expected='NOTICE checksums.txt chinese-poetry-MIT.txt data-source-manifest.json hanconv-MIT.txt opencc-dictionaries-Apache-2.0.txt opencc-dictionaries.SHA256 poetry.db.gz poetry.db.source-report.json'
          actual=$(jq -r '.assets[] | select(.size > 0) | .name' data-release.json | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          [ "$actual" = "$expected" ] || {
            echo "Data release assets are missing, empty, or unexpected: $actual" >&2
            exit 1
          }

          mkdir data-release
          for asset in $expected; do
            gh release download "$DATA_TAG" --dir data-release --pattern "$asset"
          done
          (
            cd data-release
            awk '$2 != "poetry.db" { print }' checksums.txt | sha256sum -c -
            gzip -dc poetry.db.gz > poetry.db
            sha256sum -c <(awk '$2 == "poetry.db" { print }' checksums.txt)
          )
          EXPECTED_RELEASE_TAG="$DATA_TAG" sh scripts/verify-data-contract.sh \
            --database data-release/poetry.db \
            --source-report data-release/poetry.db.source-report.json \
            --manifest data-release/data-source-manifest.json

          DATA_COMMIT=$(jq -er '.pipeline.commit' data-release/data-source-manifest.json)
          DATA_TAG_COMMIT=$(git rev-list -n 1 "$DATA_TAG")
          [ "$DATA_COMMIT" = "$DATA_TAG_COMMIT" ] || {
            echo "Data release manifest does not identify the data tag commit" >&2
            exit 1
          }
          git merge-base --is-ancestor "$DATA_COMMIT" "$RELEASE_SHA" || {
            echo "Image source is not descended from its data-release source" >&2
            exit 1
          }

  publish:
    if: inputs.release_tag != '' || !endsWith(github.ref_name, '.0')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve recoverable publication state
        id: publication
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          VERSION=${RELEASE_TAG#v}
          IMAGE=${REGISTRY}/${IMAGE_NAME}
          ANCHOR_TAG=sha-${RELEASE_SHA}

          inspect_tag() {
            local tag=$1
            if docker buildx imagetools inspect "${IMAGE}:${tag}" \
              --format '{{json .Manifest}}' \
              > inspected-manifest.json 2> inspected-manifest.error; then
              return 0
            fi
            if grep -Eqi 'not found|manifest unknown|no such manifest' \
              inspected-manifest.error; then
              return 1
            fi
            echo "Could not resolve image tag ${tag}:" >&2
            cat inspected-manifest.error >&2
            exit 1
          }

          anchor_exists=false
          anchor_digest=
          if inspect_tag "$ANCHOR_TAG"; then
            anchor_exists=true
            anchor_digest=$(jq -er '
              .digest | select(test("^sha256:[0-9a-f]{64}$"))
            ' inspected-manifest.json)
          fi

          for tag in "$VERSION" "$RELEASE_TAG"; do
            if inspect_tag "$tag"; then
              [[ $anchor_exists == true ]] || {
                echo "Version tag ${tag} exists without the canonical SHA tag" >&2
                exit 1
              }
              observed=$(jq -er '.digest' inspected-manifest.json)
              [[ $observed == "$anchor_digest" ]] || {
                echo "Image tag ${tag} points to a conflicting digest" >&2
                exit 1
              }
            fi
          done

          echo "anchor_exists=${anchor_exists}" >>"$GITHUB_OUTPUT"
          echo "digest=${anchor_digest}" >>"$GITHUB_OUTPUT"
      - name: Extract immutable version metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.release_tag || github.ref_name }}
            type=semver,value=${{ inputs.release_tag || github.ref_name }},pattern={{version}}
            type=raw,value=sha-${{ inputs.release_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.release_sha || github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Verify immutable image metadata before publishing
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          EXPECTED_REVISION: ${{ inputs.release_sha || github.sha }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          VERSION=${RELEASE_TAG#v}
          jq -e \
            --arg revision "$EXPECTED_REVISION" \
            --arg version "$VERSION" \
            --arg release_tag "$RELEASE_TAG" \
            --arg image "$IMAGE" '
            .labels["org.opencontainers.image.source"] ==
              "https://github.com/ericismyeldestson/chinese-poetry-api" and
            .labels["org.opencontainers.image.revision"] == $revision and
            .labels["org.opencontainers.image.licenses"] == "GPL-3.0-only" and
            .labels["org.opencontainers.image.version"] == $version and
            (.tags | sort) == ([
              $image + ":" + $release_tag,
              $image + ":" + $version,
              $image + ":sha-" + $revision
            ] | sort)
          ' <<<"$METADATA_JSON" >/dev/null
      - name: Build and push the canonical SHA image
        id: push
        if: steps.publication.outputs.anchor_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VCS_REF=${{ inputs.release_sha || github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ inputs.release_sha || github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Resolve the canonical image digest
        id: subject
        env:
          ANCHOR_EXISTS: ${{ steps.publication.outputs.anchor_exists }}
          EXISTING_DIGEST: ${{ steps.publication.outputs.digest }}
          BUILT_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          if [[ $ANCHOR_EXISTS == true ]]; then
            IMAGE_DIGEST=$EXISTING_DIGEST
          else
            IMAGE_DIGEST=$BUILT_DIGEST
          fi
          [[ $IMAGE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Canonical image digest is missing or malformed" >&2
            exit 1
          }
          for attempt in 1 2 3 4 5 6; do
            if docker buildx imagetools inspect \
              "${REGISTRY}/${IMAGE_NAME}:sha-${RELEASE_SHA}" \
              --format '{{json .Manifest}}' \
              > canonical-manifest.tmp 2> canonical-manifest.error; then
              mv canonical-manifest.tmp canonical-manifest.json
              break
            fi
            if [[ $attempt == 6 ]]; then
              cat canonical-manifest.error >&2
              exit 1
            fi
            sleep 5
          done
          observed=$(jq -er '.digest' canonical-manifest.json)
          [[ $observed == "$IMAGE_DIGEST" ]] || {
            echo "Canonical SHA tag does not resolve to the expected digest" >&2
            exit 1
          }
          echo "digest=${IMAGE_DIGEST}" >>"$GITHUB_OUTPUT"
      - name: Verify the canonical image before publishing version tags
        env:
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          VERSION=${RELEASE_TAG#v}
          DATA_TAG=v${VERSION%.*}.0
          scripts/verify-published-image.sh \
            "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" \
            "$RELEASE_SHA" "$VERSION" "$DATA_TAG" \
            "${RUNNER_TEMP}/published-image-evidence"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true
      - name: Verify GitHub provenance before publishing version tags
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh attestation verify \
              "oci://${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$RELEASE_SHA" \
              --source-ref "refs/tags/${RELEASE_TAG}" \
              --signer-digest "$RELEASE_SHA" \
              --signer-workflow \
                "${GITHUB_REPOSITORY}/.github/workflows/release-image.yml" \
              --deny-self-hosted-runners \
              --bundle-from-oci \
              --format json \
              > github-attestation.tmp 2> github-attestation.error; then
              mv github-attestation.tmp github-attestation.json
              break
            fi
            if [[ $attempt == 6 ]]; then
              cat github-attestation.error >&2
              exit 1
            fi
            sleep 5
          done
          jq -e 'length >= 1' github-attestation.json >/dev/null
      - name: Complete and verify immutable version tags
        env:
          IMAGE_DIGEST: ${{ steps.subject.outputs.digest }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -Eeuo pipefail
          VERSION=${RELEASE_TAG#v}
          IMAGE=${REGISTRY}/${IMAGE_NAME}

          inspect_tag() {
            local tag=$1
            if docker buildx imagetools inspect "${IMAGE}:${tag}" \
              --format '{{json .Manifest}}' \
              > inspected-manifest.json 2> inspected-manifest.error; then
              return 0
            fi
            if grep -Eqi 'not found|manifest unknown|no such manifest' \
              inspected-manifest.error; then
              return 1
            fi
            echo "Could not resolve image tag ${tag}:" >&2
            cat inspected-manifest.error >&2
            exit 1
          }

          verify_tag() {
            local tag=$1
            local attempt
            local observed
            for attempt in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "${IMAGE}:${tag}" \
                --format '{{json .Manifest}}' \
                > final-manifest.tmp 2> final-manifest.error; then
                mv final-manifest.tmp final-manifest.json
                observed=$(jq -er '.digest' final-manifest.json)
                [[ $observed == "$IMAGE_DIGEST" ]] || {
                  echo "Image tag ${tag} points to a conflicting digest" >&2
                  exit 1
                }
                return 0
              fi
              if [[ $attempt == 6 ]]; then
                cat final-manifest.error >&2
                exit 1
              fi
              sleep 5
            done
          }

          missing_tags=()
          for tag in "$VERSION" "$RELEASE_TAG"; do
            if inspect_tag "$tag"; then
              observed=$(jq -er '.digest' inspected-manifest.json)
              [[ $observed == "$IMAGE_DIGEST" ]] || {
                echo "Image tag ${tag} points to a conflicting digest" >&2
                exit 1
              }
            else
              missing_tags+=("$tag")
            fi
          done

          if (( ${#missing_tags[@]} > 0 )); then
            for tag in "${missing_tags[@]}"; do
              if inspect_tag "$tag"; then
                observed=$(jq -er '.digest' inspected-manifest.json)
                [[ $observed == "$IMAGE_DIGEST" ]] || {
                  echo "Image tag ${tag} appeared with a conflicting digest" >&2
                  exit 1
                }
              else
                docker buildx imagetools create \
                  --tag "${IMAGE}:${tag}" "${IMAGE}@${IMAGE_DIGEST}"
              fi
              verify_tag "$tag"
            done
          fi

          for tag in "sha-${RELEASE_SHA}" "$VERSION" "$RELEASE_TAG"; do
            verify_tag "$tag"
          done
          echo "All immutable image tags resolve to ${IMAGE_DIGEST}"
