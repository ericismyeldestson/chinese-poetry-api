# LOCAL CANDIDATE ONLY. Never merge this synthetic fixture.
name: Test
run-name: required-checks negative canary - cancelled
'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions: {}
concurrency:
  group: required-checks-negative-canary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.head_ref == 'agent/required-checks-negative-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthetic fixture only - not a product test
        shell: bash
        run: |
          echo "Cancellation target: cancel only this new canary run"
          sleep 180
          echo "Cancellation was not observed; fail closed"
          exit 1
  coverage-upload:
    if: github.head_ref == 'agent/required-checks-negative-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthetic fixture only - not a product test
        shell: bash
        run: |
          exit 0
  vulnerability-scan:
    if: github.head_ref == 'agent/required-checks-negative-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthetic fixture only - not a product test
        shell: bash
        run: |
          exit 0
  data-quality-contract:
    if: github.head_ref == 'agent/required-checks-negative-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthetic fixture only - not a product test
        shell: bash
        run: |
          exit 0
  license-contract:
    if: github.head_ref == 'agent/required-checks-negative-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthetic fixture only - not a product test
        shell: bash
        run: |
          exit 0
  container-preflight:
    if: github.head_ref == 'agent/required-checks-negative-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthetic fixture only - not a product test
        shell: bash
        run: |
          exit 0
  full-data-preflight:
    if: github.head_ref == 'agent/required-checks-negative-canary' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synthetic fixture only - not a product test
        shell: bash
        run: |
          exit 0

  required-checks:
    name: required-checks
    if: always()
    needs:
      - test
      - coverage-upload
      - vulnerability-scan
      - data-quality-contract
      - license-contract
      - container-preflight
      - full-data-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every mandatory job to succeed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if ! jq --exit-status --slurp '
            length == 1 and
            (.[0] |
              type == "object" and
              keys == [
                "container-preflight",
                "coverage-upload",
                "data-quality-contract",
                "full-data-preflight",
                "license-contract",
                "test",
                "vulnerability-scan"
              ] and
              all(.[]; type == "object" and .result == "success")
            )
          ' <<<"$NEEDS_JSON" >/dev/null; then
            echo "Required jobs must all finish with success; missing, skipped, cancelled, or failed jobs block merging." >&2
            exit 1
          fi
          echo "All seven required jobs completed successfully."
