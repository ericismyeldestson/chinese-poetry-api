server:
  port: 1279
  mode: release  # debug, release, test
  # Empty means forwarded IP headers are ignored. Add only reverse proxies you operate.
  trusted_proxies: []
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s

database:
  # Connection pool settings (0 = auto-detect based on CPU cores)
  # Auto-detection: max_open_conns = min(NumCPU, 16), max_idle_conns = max_open_conns/2
  # Manual override: max_open_conns is capped at 16 (e.g., 8 open, 4 idle)
  max_open_conns: 0  # 0 = auto (recommended), or set manually
  max_idle_conns: 0  # 0 = auto (recommended), or set manually

rate_limit:
  enabled: true
  requests_per_second: 10
  burst: 20

graphql:
  playground: false  # Enable GraphQL Playground (set to true for development)
  introspection: false  # Opt in only for trusted development environments
  complexity_limit: 1000
  max_request_body_bytes: 1048576  # 1 MiB
